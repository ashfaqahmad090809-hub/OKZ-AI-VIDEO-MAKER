
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKZ AI VIDEO MAKER</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090914;
  color: white;
  min-height: 100vh;
  padding: 25px 15px;
}

.container {
  max-width: 750px;
  margin: 40px auto;
  background: #151527;
  padding: 30px;
  border-radius: 20px;
  border: 1px solid #333354;
}

h1 {
  text-align: center;
  color: #a78bfa;
  font-size: 32px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  margin-bottom: 30px;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

textarea, select {
  width: 100%;
  padding: 14px;
  background: #090914;
  border: 1px solid #444466;
  color: white;
  border-radius: 10px;
  font-size: 16px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 22px;
  background: linear-gradient(90deg, #7c3aed, #a855f7);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #090914;
  border: 1px solid #444466;
  border-radius: 12px;
  white-space: pre-wrap;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.secondary {
  background: #292943;
  margin-top: 12px;
}

.footer {
  text-align: center;
  color: #777;
  margin-top: 25px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>OKZ AI VIDEO MAKER</h1>

<p class="subtitle">
Create Amazing AI Video Ideas In Seconds
</p>

<label for="idea">Enter Your Video Idea</label>
<textarea id="idea"
placeholder="Example: A futuristic city in the year 2050..."></textarea>

<label for="style">Select Video Style</label>
<select id="style">
  <option>Cinematic</option>
  <option>Realistic</option>
  <option>Anime</option>
  <option>3D Animation</option>
  <option>Fantasy</option>
  <option>Documentary</option>
</select>

<label for="ratio">Select Video Ratio</label>
<select id="ratio">
  <option value="16:9">16:9 - YouTube</option>
  <option value="9:16">9:16 - TikTok / Reels</option>
  <option value="1:1">1:1 - Square</option>
</select>

<label for="duration">Select Video Duration</label>
<select id="duration">
  <option value="15 seconds">15 Seconds</option>
  <option value="30 seconds">30 Seconds</option>
  <option value="60 seconds">60 Seconds</option>
</select>

<button onclick="generateVideo()">
Generate Video Idea
</button>

<div id="result"></div>

<button id="downloadBtn" class="secondary"
style="display:none" onclick="downloadResult()">
Download Storyboard
</button>

<p class="footer">
Powered by OKZ AI VIDEO MAKER
</p>

</div>

<script>
let generatedText = "";

function generateVideo() {
  const idea = document.getElementById("idea").value.trim();
  const style = document.getElementById("style").value;
  const ratio = document.getElementById("ratio").value;
  const duration = document.getElementById("duration").value;

  if (!idea) {
    alert("Please enter your video idea first!");
    return;
  }

  generatedText =
`OKZ AI VIDEO MAKER
==================

VIDEO IDEA:
${idea}

VIDEO STYLE:
${style}

VIDEO RATIO:
${ratio}

VIDEO DURATION:
${duration}

AI VIDEO PROMPT:
Create a ${style.toLowerCase()} video about ${idea}.
Use a ${ratio} aspect ratio.
Duration: ${duration}.
Use beautiful visuals, smooth camera movements,
professional lighting and high-quality details.

STORYBOARD:

SCENE 1 - INTRODUCTION
Introduce the main idea with an attractive opening shot.

SCENE 2 - DEVELOPMENT
Show the main action with interesting camera angles.

SCENE 3 - HIGHLIGHT
Show the most exciting moment with cinematic visuals.

SCENE 4 - ENDING
Finish with a memorable final shot.
`;

  const result = document.getElementById("result");
  result.textContent = generatedText;
  result.style.display = "block";

  document.getElementById("downloadBtn").style.display = "block";
}

function downloadResult() {
  const blob = new Blob([generatedText], {
    type: "text/plain"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "OKZ-AI-Storyboard.txt";
  link.click();

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
