
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKZ AI VIDEO MAKER</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#090914;color:white;font-family:Arial,sans-serif}
.container{max-width:700px;margin:auto}
h1{text-align:center;color:#65a4ff}
.subtitle{text-align:center;color:#aaa}
.panel{background:#17172a;padding:20px;border-radius:16px;margin-top:20px}
label{display:block;margin:15px 0 7px}
input,select,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#24243a;color:white;font-size:16px}
textarea{min-height:100px}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:10px;background:#367cf5;color:white;font-size:16px;font-weight:bold}
button.secondary{background:#34344d}
#output{white-space:pre-wrap;line-height:1.6;color:#ddd}
.notice{color:#ffc96b;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h1>🎬 OKZ AI VIDEO MAKER</h1>
<p class="subtitle">Create your video ideas and storyboards</p>

<div class="panel">
<label>Video Idea</label>
<textarea id="idea" placeholder="Describe your video idea..."></textarea>

<label>Video Style</label>
<select id="style">
<option>Anime</option>
<option>Realistic</option>
<option>Cinematic</option>
<option>3D Animation</option>
<option>Cartoon</option>
<option>Fantasy</option>
<option>Sci-Fi</option>
<option>Nature</option>
</select>

<label>Video Duration</label>
<select id="duration">
<option value="1">1 Minute</option>
<option value="2">2 Minutes</option>
<option value="3">3 Minutes</option>
<option value="4">4 Minutes</option>
<option value="5">5 Minutes</option>
</select>

<label>Aspect Ratio</label>
<select id="ratio">
<option>16:9 (Landscape)</option>
<option>9:16 (Portrait)</option>
<option>1:1 (Square)</option>
</select>

<label>Mood</label>
<select id="mood">
<option>Epic</option>
<option>Emotional</option>
<option>Mysterious</option>
<option>Funny</option>
<option>Peaceful</option>
<option>Action</option>
</select>

<button onclick="makeStoryboard()">Create Storyboard</button>
</div>

<div class="panel">
<h2>Video Storyboard</h2>
<div id="output">Your storyboard will appear here.</div>
<button class="secondary" onclick="copyPrompt()">Copy Video Prompt</button>
<button class="secondary" onclick="downloadStory()">Download Storyboard</button>
<p class="notice">Note: This version creates video prompts and storyboards. Actual AI video rendering requires a secure video-generation backend.</p>
</div>
</div>

<script>
let currentPrompt = "";

function makeStoryboard(){
 const idea=document.getElementById("idea").value.trim();
 if(!idea){
  alert("Please enter your video idea.");
  return;
 }

 const style=document.getElementById("style").value;
 const duration=Number(document.getElementById("duration").value);
 const ratio=document.getElementById("ratio").value;
 const mood=document.getElementById("mood").value;

 const scenes=duration*4;
 currentPrompt=
 "Create a "+duration+" minute "+style+" video.\n"+
 "Idea: "+idea+"\n"+
 "Mood: "+mood+"\n"+
 "Aspect ratio: "+ratio+"\n"+
 "Visual quality: detailed, smooth animation, consistent characters, professional lighting.";

 let result="VIDEO DETAILS\n";
 result+="Style: "+style+"\nDuration: "+duration+" minute(s)\n";
 result+="Aspect Ratio: "+ratio+"\nMood: "+mood+"\n\n";
 result+="VIDEO PROMPT\n"+currentPrompt+"\n\n";
 result+="STORYBOARD\n";

 for(let i=1;i<=scenes;i++){
  result+="Scene "+i+": Show the next part of the story with "+style+
  " visuals, consistent characters and "+mood.toLowerCase()+" atmosphere.\n";
 }

 document.getElementById("output").textContent=result;
}

function copyPrompt(){
 if(!currentPrompt){
  alert("Create a storyboard first.");
  return;
 }
 navigator.clipboard.writeText(currentPrompt)
 .then(()=>alert("Prompt copied!"))
 .catch(()=>alert("Copy is not available in this browser."));
}

function downloadStory(){
 const text=document.getElementById("output").textContent;
 if(text==="Your storyboard will appear here."){
  alert("Create a storyboard first.");
  return;
 }
 const file=new Blob([text],{type:"text/plain"});
 const link=document.createElement("a");
 link.href=URL.createObjectURL(file);
 link.download="OKZ-Video-Storyboard.txt";
 link.click();
 URL.revokeObjectURL(link.href);
}
</script>
</body>
</html>
